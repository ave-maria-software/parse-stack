name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (ruby ${{ matrix.ruby }} / activesupport ${{ matrix.activesupport }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4']
        # The 6.1 axis matches the oldest supported consumer; drop it once no
        # consumer runs Rails 6.1.
        activesupport: ['6.1.7.8', '~> 8.1']
        exclude:
          # Ruby 3.4 removed base64 (and friends) from default gems and Rails
          # 6.1 assumes them; the 6.1 axis targets Ruby 3.3 only.
          - ruby: '3.4'
            activesupport: '6.1.7.8'
    env:
      AS_VERSION: ${{ matrix.activesupport }}
    steps:
      - uses: actions/checkout@v4
      - name: Pin activesupport/activemodel for the matrix axis
        # concurrent-ruby >= 1.3.5 breaks ActiveSupport 6.1 (it stopped
        # requiring 'logger', which AS 6.1 assumed was loaded).
        run: |
          cat >> Gemfile <<RUBY
          gem 'activesupport', ENV['AS_VERSION']
          gem 'activemodel', ENV['AS_VERSION']
          gem 'concurrent-ruby', '< 1.3.5' if ENV['AS_VERSION'].start_with?('6.')
          RUBY
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test

  secrets_scan:
    name: secrets scan (detector — the barrier is the publisher)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: check_no_secrets over the pushed range
        env:
          BASE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            ruby bin/check_no_secrets --all-history
          else
            ruby bin/check_no_secrets --range "$BASE..$HEAD"
          fi
      - name: gitleaks (generic patterns + entropy)
        # Plain binary: gitleaks-action requires a paid license for org repos.
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar xz gitleaks
          ./gitleaks git . --no-banner --redact
          rm gitleaks
